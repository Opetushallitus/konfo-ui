name: setup-node-env
description: 'Setup node and pnpm, with auth for the @opetushallitus GitHub Packages registry (requires NODE_AUTH_TOKEN)'
inputs:
  install:
    description: 'Whether to run `pnpm install`'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.tool-versions'
        check-latest: true
        registry-url: 'https://npm.pkg.github.com'
        scope: '@opetushallitus'
    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        working-directory: 'src/main/app'
        install: ${{ inputs.install }}
        cache: true
